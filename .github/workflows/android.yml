name: KORAX Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test football data worker
        working-directory: worker
        run: |
          npm run check
          npm test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build optimized release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Prepare public APK asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk KORAX-Android.apk
          file KORAX-Android.apk
      - name: Publish optimized APK as a GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: KORAX Android optimized build ${{ github.run_number }}
          body: |
            Optimized KORAX Android APK.
            R8 code shrinking and Android resource shrinking are enabled.
            App features and dependencies are retained; only unused code/resources are removed.
            This CI build is signed with the Android debug certificate for installable testing.
            It is not a production signing key.
          prerelease: true
          draft: false
          make_latest: false
          files: KORAX-Android.apk
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORAX-optimized-apk
          path: KORAX-Android.apk
          if-no-files-found: error
          retention-days: 14
