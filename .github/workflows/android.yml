name: KORAX Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test football data worker
        working-directory: worker
        run: |
          npm run check
          npm test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Configure Firebase Android app (optional until project setup)
        env:
          FIREBASE_CONFIG_JSON_B64: ${{ secrets.FIREBASE_CONFIG_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON_B64" ]; then
            printf '%s' "$FIREBASE_CONFIG_JSON_B64" | base64 --decode > app/google-services.json
            echo "Firebase Android configuration installed for this build."
          else
            echo "Firebase config not supplied; Google sign-in will remain unavailable in this build."
          fi
      - name: Validate release integration configuration
        id: release_config
        env:
          KOORA_API_BASE_URL: ${{ secrets.KOORA_API_BASE_URL }}
          FIREBASE_CONFIG_JSON_B64: ${{ secrets.FIREBASE_CONFIG_JSON_B64 }}
        run: |
          ready=true
          if [ -z "$KOORA_API_BASE_URL" ] || [[ "$KOORA_API_BASE_URL" != https://* ]]; then
            echo "Release APK blocked: configure KOORA_API_BASE_URL with the deployed Cloudflare Worker HTTPS URL."
            ready=false
          fi
          if [ -z "$FIREBASE_CONFIG_JSON_B64" ]; then
            echo "Release APK blocked: Firebase config is required for Google sign-in and cloud fantasy sync."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build optimized release APK
        run: gradle :app:assembleRelease --stacktrace -PKOORA_API_BASE_URL="${{ secrets.KOORA_API_BASE_URL }}"
      - name: Print Android signing fingerprints for Firebase setup
        run: gradle :app:signingReport --console=plain
      - name: Prepare public APK asset
        if: steps.release_config.outputs.ready == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk KORAX-Android.apk
          file KORAX-Android.apk
      - name: Publish optimized APK as a GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_config.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: KORAX Android optimized build ${{ github.run_number }}
          body: |
            Optimized KORAX Android APK.
            R8 code shrinking and Android resource shrinking are enabled.
            App features and dependencies are retained; only unused code/resources are removed.
            This CI build is signed with the Android debug certificate for installable testing.
            It is not a production signing key.
          prerelease: true
          draft: false
          make_latest: false
          files: KORAX-Android.apk
      - name: Upload APK workflow artifact
        if: steps.release_config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KORAX-optimized-apk
          path: KORAX-Android.apk
          if-no-files-found: error
          retention-days: 14
