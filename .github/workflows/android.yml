name: KORAX Android build # Supabase fixture and detail cache validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test football data worker
        working-directory: worker
        run: |
          npm run check
          npm test

      - name: Sync live SportScore data into Supabase cache
        env:
          SUPABASE_URL: https://hwrsjmdcivdluztnhpxo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_qGcLhGeCxVU5MvFVQ2YlPQ_XKGS42QW
          KORAX_FORCE_FULL_SYNC: "true"
        run: node scripts/sync-sportscore.mjs

      - name: Verify Supabase KORAX API endpoints
        env:
          KOORA_API_BASE_URL: https://hwrsjmdcivdluztnhpxo.supabase.co/functions/v1/korax-api
        run: |
          set -euo pipefail
          base="${KOORA_API_BASE_URL%/}"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_qGcLhGeCxVU5MvFVQ2YlPQ_XKGS42QW"
          api_curl() {
            curl --header "apikey: $SUPABASE_PUBLISHABLE_KEY" "$@"
          }

          health="$(api_curl --silent --show-error --fail --retry 18 --retry-all-errors --retry-delay 5 --max-time 20 "$base/health")"
          printf '%s' "$health" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.ok !== true || value.service !== "KORAX API") {
                throw new Error("Unexpected production Supabase health response: " + raw);
              }
              console.log("KORAX Supabase health passed:", value.service);
            });
          '

          competitions="$(api_curl --silent --show-error --fail --max-time 25 "$base/api/competitions")"
          printf '%s' "$competitions" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (!Array.isArray(value.data) || value.data.length === 0) {
                throw new Error("Competition API returned no usable data: " + raw);
              }
              console.log("Competitions endpoint passed:", value.data.length, "items");
            });
          '

          news="$(api_curl --silent --show-error --fail --max-time 60 "$base/api/news?language=ar&per_page=10")"
          printf '%s' "$news" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.source !== "publisher-rss" || !Array.isArray(value.data)) {
                throw new Error("Arabic news API response does not match the KORAX contract: " + raw);
              }
              if (value.data.length === 0) throw new Error("Arabic RSS returned zero articles. The app news feed would be empty.");
              const broken = value.data.filter(item => !item.title || !/^https:\/\//.test(item.url || "") || !item.source);
              if (broken.length) throw new Error("Arabic RSS contains " + broken.length + " article rows without title, HTTPS URL or source.");
              const wrongLanguage = value.data.filter(item => item.language && item.language !== "ar");
              if (wrongLanguage.length) throw new Error("Arabic RSS endpoint returned non-Arabic rows.");
              console.log("Arabic news feed passed:", value.data.length, "valid articles");
            });
          '

          echo "Testing official SportScore public API directly from the GitHub runner..."
          for provider_url in \
            "https://sportscore.com/api/widget/matches/?sport=football&limit=3" \
            "https://sportscore.com/api/v1/fixtures/?sport=football&date=$(date -u +%F)&limit=3" \
            "https://sportscore.com/api/v1/matches/?sport=football&limit=3"; do
            status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/sportscore-direct.json" --write-out '%{http_code}' --header "user-agent: sportscore-mcp/0.3 (+https://sportscore.com/developers/)" --header "accept: application/json" "$provider_url" || true)"
            PROVIDER_URL="$provider_url" PROVIDER_STATUS="$status" node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/sportscore-direct.json", "utf8");
              let value = null;
              try { value = JSON.parse(raw); } catch {}
              const root = value?.data ?? value;
              const rows = Array.isArray(root) ? root : (root?.matches || root?.fixtures || root?.results || []);
              console.log("SportScore direct:", process.env.PROVIDER_URL, "HTTP", process.env.PROVIDER_STATUS,
                "keys", Object.keys(value || {}), "rows", rows.length,
                "sample", JSON.stringify(rows[0] || null).slice(0, 2500));
            '
          done

                    matches="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches?live=1")"
          printf '%s' "$matches" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.source !== "sportscore-supabase-cache" || !Array.isArray(value.data)) {
                throw new Error("Live matches API response does not match the KORAX contract: " + raw);
              }
              console.log("Live matches endpoint passed:", value.data.length, "current live matches");
            });
          '

          match_date="$(date -u +%F)"
          schedule="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches?date=$match_date")"

          raw_fixtures="$(curl --silent --show-error --fail --max-time 35 "https://sportscore.com/api/v1/fixtures/?sport=football&date=$match_date&limit=3")"
          printf '%s' "$raw_fixtures" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const root = value?.data ?? value;
              const rows = Array.isArray(root) ? root : (root?.fixtures || root?.matches || root?.results || []);
              const sample = rows[0] || {};
              console.log("SportScore raw fixture diagnostic:", JSON.stringify({
                topKeys: Object.keys(value || {}),
                rowCount: rows.length,
                sampleKeys: Object.keys(sample),
                sample: sample
              }).slice(0, 5000));
            });
          '
          printf '%s' "$schedule" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.source !== "sportscore-supabase-cache" || !Array.isArray(value.data)) {
                throw new Error("Dated matches API response does not match the KORAX contract: " + raw);
              }
              if (value.data.length === 0) throw new Error("SportScore returned no scheduled fixtures for the current UTC date.");
              const first = value.data.find(item => item.id && (item.homeTeam?.name || item.home) && (item.awayTeam?.name || item.away));
              if (!first) throw new Error("Fixtures are returned but none has a match ID and both team names.");
              console.log("Fixture schedule passed:", value.data.length, "matches; sample:", first.id);
            });
          '

          match_id="$(printf '%s' "$schedule" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const first = value.data.find(item => item.id && (item.homeTeam?.name || item.home) && (item.awayTeam?.name || item.away));
              if (!first) process.exit(2);
              process.stdout.write(String(first.id));
            });
          ')"
          match_detail="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches/$match_id")"
          printf '%s' "$match_detail" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const item = value.data;
              const home = item?.homeTeam?.name || item?.home;
              const away = item?.awayTeam?.name || item?.away;
              if (!item || !home || !away) throw new Error("Match detail did not return both teams: " + raw);
              if (item.detailAvailable !== true) throw new Error("The selected match does not have a cached detail record.");
              if (!Array.isArray(item.events) || !Array.isArray(item.lineups) || !Array.isArray(item.statistics)) {
                throw new Error("Match detail is missing normalized events, lineups or statistics arrays.");
              }
              console.log("Match detail passed:", home, "vs", away, "; events:", item.events.length, "; lineups:", item.lineups.length);
            });
          '

          first_competition="$(printf '%s' "$competitions" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const first = value.data.find(item => item.slug || item.id);
              if (!first) process.exit(2);
              process.stdout.write(String(first.slug || first.id));
            });
          ')"
          standings="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/competitions/$first_competition")"
          printf '%s' "$standings" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const data = value.data;
              const tables = Array.isArray(data?.tables) ? data.tables : [];
              const rows = tables.flatMap(table => Array.isArray(table?.rows) ? table.rows : []);
              if (rows.length === 0) throw new Error("Competition standings returned no team rows.");
              console.log("Competition standings passed:", rows.length, "teams");
            });
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Configure Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'korax-release' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/korax-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/korax-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable Android release signing key configured."
          else
            echo "Stable Android release signing key not supplied."
          fi
      - name: Validate release integration configuration
        id: release_config
        env:
          KOORA_API_BASE_URL: https://hwrsjmdcivdluztnhpxo.supabase.co/functions/v1/korax-api
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ready=true
          if [ -z "$KOORA_API_BASE_URL" ] || [[ "$KOORA_API_BASE_URL" != https://* ]]; then
            echo "Release APK blocked: configure KOORA_API_BASE_URL with the deployed Supabase Edge Function HTTPS URL."
            ready=false
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release APK blocked: configure all Android release signing secrets."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build optimized release APK
        run: gradle :app:assembleRelease --stacktrace -PKOORA_API_BASE_URL="https://hwrsjmdcivdluztnhpxo.supabase.co/functions/v1/korax-api"
      - name: Prepare test APK asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk KORAX-Android.apk
          file KORAX-Android.apk
      - name: Verify signed APK with apksigner
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs KORAX-Android.apk

      - name: Publish optimized APK as a GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_config.outputs.ready == 'true' && vars.KORAX_RELEASE_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: KORAX Android optimized build ${{ github.run_number }}
          body: |
            Optimized KORAX Android APK.
            R8 code shrinking and Android resource shrinking are enabled.
            App features and dependencies are retained; only unused code/resources are removed.
            Installable integration build. Production release requires a stable upload key and Play App Signing.
          prerelease: true
          draft: false
          make_latest: false
          files: KORAX-Android.apk
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORAX-optimized-apk
          path: KORAX-Android.apk
          if-no-files-found: error
          retention-days: 14
