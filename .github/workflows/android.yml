name: KORAX Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test SportScore detail batching
        run: node --test scripts/sync-sportscore-batching.test.mjs scripts/football-news-filter.test.mjs
      - name: Test football data worker
        working-directory: worker
        run: |
          npm run check
          npm test

      - name: Verify Supabase KORAX API endpoints
        env:
          KOORA_API_BASE_URL: https://hwrsjmdcivdluztnhpxo.supabase.co/functions/v1/korax-api
        run: |
          set -euo pipefail
          base="${KOORA_API_BASE_URL%/}"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_qGcLhGeCxVU5MvFVQ2YlPQ_XKGS42QW"
          api_curl() {
            curl --header "apikey: $SUPABASE_PUBLISHABLE_KEY" "$@"
          }

          health="$(api_curl --silent --show-error --fail --retry 18 --retry-all-errors --retry-delay 5 --max-time 20 "$base/health")"
          printf '%s' "$health" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.ok !== true || value.service !== "KORAX API") {
                throw new Error("Unexpected production Supabase health response: " + raw);
              }
              console.log("KORAX Supabase health passed:", value.service);
            });
          '

          competitions="$(api_curl --silent --show-error --fail --max-time 25 "$base/api/competitions")"
          printf '%s' "$competitions" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (!Array.isArray(value.data) || value.data.length === 0) {
                throw new Error("Competition API returned no usable data: " + raw);
              }
              console.log("Competitions endpoint passed:", value.data.length, "items");
            });
          '

          news="$(api_curl --silent --show-error --fail --max-time 60 "$base/api/news?language=ar&per_page=10")"
          printf '%s' "$news" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.source !== "publisher-rss" || !Array.isArray(value.data)) {
                throw new Error("Arabic news API response does not match the KORAX contract: " + raw);
              }
              if (value.data.length === 0) throw new Error("Arabic RSS returned zero articles. The app news feed would be empty.");
              const broken = value.data.filter(item => !item.title || !/^https:\/\//.test(item.url || "") || !item.source);
              if (broken.length) throw new Error("Arabic RSS contains " + broken.length + " article rows without title, HTTPS URL or source.");
              const wrongLanguage = value.data.filter(item => item.language && item.language !== "ar");
              if (wrongLanguage.length) throw new Error("Arabic RSS endpoint returned non-Arabic rows.");
              console.log("Arabic news feed passed:", value.data.length, "valid articles");
            });
          '

          matches="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches?live=1")"
          printf '%s' "$matches" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.source !== "sportscore-supabase-cache" || !Array.isArray(value.data)) {
                throw new Error("Live matches API response does not match the KORAX contract: " + raw);
              }
              console.log("Live matches endpoint passed:", value.data.length, "current live matches");
            });
          '

          match_date="$(date -u +%F)"
          schedule="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches?date=$match_date")"

          printf '%s' "$schedule" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              if (value.source !== "sportscore-supabase-cache" || !Array.isArray(value.data)) {
                throw new Error("Dated matches API response does not match the KORAX contract: " + raw);
              }
              if (value.data.length === 0) throw new Error("SportScore returned no scheduled fixtures for the current UTC date.");
              const first = value.data.find(item => item.id && (item.homeTeam?.name || item.home) && (item.awayTeam?.name || item.away));
              if (!first) throw new Error("Fixtures are returned but none has a match ID and both team names.");
              console.log("Fixture schedule passed:", value.data.length, "matches; sample:", first.id);
            });
          '

          match_id="$(printf '%s' "$schedule" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const first = value.data.find(item =>
                item.detailAvailable === true &&
                item.id &&
                (item.homeTeam?.name || item.home) &&
                (item.awayTeam?.name || item.away)
              );
              if (first) process.stdout.write(String(first.id));
            });
          ')"
          if [ -n "$match_id" ]; then
            match_detail="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches/$match_id")"
            printf '%s' "$match_detail" | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                const item = value.data;
                const home = item?.homeTeam?.name || item?.home;
                const away = item?.awayTeam?.name || item?.away;
                if (!item || !home || !away) throw new Error("Match detail did not return both teams: " + raw);
                if (item.detailAvailable !== true) throw new Error("The selected match does not have a cached detail record.");
                if (!Array.isArray(item.events) || !Array.isArray(item.lineups) || !Array.isArray(item.statistics)) {
                  throw new Error("Match detail is missing normalized events, lineups or statistics arrays.");
                }
                console.log("Match detail passed:", home, "vs", away, "; events:", item.events.length, "; lineups:", item.lineups.length);
              });
            '
          else
            echo "No fixture with cached detail is available for $match_date; skipping the optional detail probe."
          fi

          # Verify the three match states used by the Android app and ensure
          # the default match list only contains the curated primary competitions.
          for mode in upcoming live finished; do
            state_payload="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches?mode=$mode&scope=main&date=$match_date")"
            printf '%s' "$state_payload" | MATCH_MODE="$mode" node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                const mode = process.env.MATCH_MODE;
                if (value.source !== "sportscore-supabase-cache" || value.meta?.mode !== mode || value.meta?.scope !== "main" || !Array.isArray(value.data)) {
                  throw new Error("Match state endpoint returned an invalid KORAX response for " + mode + ": " + raw);
                }
                const allowed = new Set([
                  "english premier league", "premier league", "spanish la liga", "la liga",
                  "french ligue 1", "ligue 1", "italian serie a", "serie a", "bundesliga",
                  "german bundesliga", "saudi professional league", "saudi pro league",
                  "uefa champions league", "egyptian premier league", "caf champions league",
                  "caf confederation cup", "afc champions league elite", "uefa europa league",
                  "uefa europa conference league", "fifa world cup", "africa cup of nations"
                ]);
                const unexpected = value.data.filter(item => {
                  const name = String(item.competitionName || item.competition?.name || "").toLowerCase();
                  return name && !allowed.has(name);
                });
                if (unexpected.length) throw new Error("Primary match list includes unrelated competitions in " + mode + ": " + unexpected.map(item => item.competitionName).join(", "));
                const badStatus = value.data.filter(item => {
                  const status = String(item.status || "").toLowerCase();
                  if (mode === "live") return !/(live|in.?play|1st.?half|2nd.?half|half.?time|\\bht\\b|\\b1h\\b|\\b2h\\b|extra.?time|penalt|مباشر|الشوط|استراحة|وقت إضافي|ركلات ترجيح)/i.test(status);
                  if (mode === "finished") return !/(finished|full.?time|ended|انتهت|نهاية|نهائي|ft)/i.test(status);
                  return /(live|in.?play|finished|full.?time|ended|مباشر|انتهت)/i.test(status);
                });
                if (badStatus.length) throw new Error("Match state filter leaked incorrect statuses in " + mode);
                console.log(mode + " match state passed:", value.data.length, "matches");
              });
            '
          done

          # Known cached detail fixture with real lineups, substitutions and incidents.
          full_detail="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/matches/x7lm7phj64pzm2w")"
          printf '%s' "$full_detail" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const item = JSON.parse(raw).data;
              if (!item || item.detailAvailable !== true) throw new Error("Known detailed fixture is not available.");
              if (!item.homeTeam?.crest?.startsWith("https://") || !item.awayTeam?.crest?.startsWith("https://")) throw new Error("Team badges were not normalized.");
              if (!item.competition?.imageUrl?.startsWith("https://")) throw new Error("Competition badge was not normalized.");
              if (!Array.isArray(item.events) || item.events.length === 0) throw new Error("SportScore incidents were not normalized to events.");
              if (!Array.isArray(item.lineups) || item.lineups.length < 20) throw new Error("SportScore home/away XIs and substitutes were not normalized.");
              if (!item.lineups.some(row => row.side === "home") || !item.lineups.some(row => row.side === "away")) throw new Error("Lineup team sides were not preserved.");
              if (!item.lineups.some(row => row.is_substitute)) throw new Error("Substitutes were not preserved.");
              console.log("Normalized match detail passed:", item.homeTeam.name, "vs", item.awayTeam.name, "; events:", item.events.length, "; lineup entries:", item.lineups.length);
            });
          '

          # Search tests must use entities that are actually present in the current
          # SportScore cache, not stale fixture names from an older provider snapshot.
          team_search_query="$(printf '%s' "$schedule" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const rows = JSON.parse(raw).data || [];
              const name = rows.map(row => row.homeTeam?.name || row.home || "").find(Boolean);
              if (!name) throw new Error("No cached home team is available for search smoke test.");
              process.stdout.write(name);
            });
          ')"
          player_search_query="$(printf '%s' "$full_detail" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const item = JSON.parse(raw).data || {};
              const rows = Array.isArray(item.lineups) ? item.lineups : [];
              const name = rows.map(row => row.name || row.player_name || row.player?.name || "").find(Boolean);
              if (!name) throw new Error("No cached lineup player is available for search smoke test.");
              process.stdout.write(name);
            });
          ')"
          competition_search_query="$(printf '%s' "$competitions" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const rows = JSON.parse(raw).data || [];
              const name = rows.map(row => row.name || row.title || "").find(Boolean);
              if (!name) throw new Error("No KORAX competition is available for search smoke test.");
              process.stdout.write(name);
            });
          ')"

          declare -A search_queries
          search_queries[teams]="$team_search_query"
          search_queries[players]="$player_search_query"
          search_queries[competitions]="$competition_search_query"

          # Search hits must also open their actual in-app cached profile routes.
          for endpoint in teams players competitions; do
            query="${search_queries[$endpoint]}"
            encoded_query="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$query")"
            search_payload="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/$endpoint?search=$encoded_query&per_page=10")"
            printf '%s' "$search_payload" | SEARCH_ENDPOINT="$endpoint" node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                if (!Array.isArray(value.data) || value.data.length === 0) throw new Error(process.env.SEARCH_ENDPOINT + " search returned no cached entity: " + raw);
                const first = value.data[0];
                if (!(first.name || first.title) || !first.slug) throw new Error(process.env.SEARCH_ENDPOINT + " search row is missing its display name or stable slug.");
                console.log(process.env.SEARCH_ENDPOINT + " search passed:", first.name || first.title);
              });
            '
            entity_slug="$(printf '%s' "$search_payload" | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const first = JSON.parse(raw).data?.[0];
                if (!first?.slug) throw new Error("Search result has no stable KORAX entity slug.");
                process.stdout.write(String(first.slug));
              });
            ')"
            profile_payload="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/$endpoint/$entity_slug")"
            printf '%s' "$profile_payload" | PROFILE_ENDPOINT="$endpoint" node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const value = JSON.parse(raw);
                const kind = process.env.PROFILE_ENDPOINT === "teams" ? "team"
                  : process.env.PROFILE_ENDPOINT === "players" ? "player" : "competition";
                const entity = kind === "competition"
                  ? (value.data?.competition || { name: value.name || value.data?.name })
                  : value.data?.[kind];
                if (!entity?.name) throw new Error(kind + " profile did not open from cached entity search: " + raw);
                console.log(kind + " cached profile passed:", entity.name);
              });
            '
          done

          first_competition="$(printf '%s' "$competitions" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const first = value.data.find(item => item.slug || item.id);
              if (!first) process.exit(2);
              process.stdout.write(String(first.slug || first.id));
            });
          ')"
          standings="$(api_curl --silent --show-error --fail --max-time 35 "$base/api/competitions/$first_competition")"
          printf '%s' "$standings" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(raw);
              const data = value.data;
              const tables = Array.isArray(data?.tables) ? data.tables : [];
              const rows = tables.flatMap(table => Array.isArray(table?.rows) ? table.rows : []);
              if (rows.length === 0) throw new Error("Competition standings returned no team rows.");
              console.log("Competition standings passed:", rows.length, "teams");
            });
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Configure Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'korax-release' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/korax-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/korax-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable Android release signing key configured."
          else
            echo "Stable Android release signing key not supplied."
          fi
      - name: Validate release integration configuration
        id: release_config
        env:
          KOORA_API_BASE_URL: https://hwrsjmdcivdluztnhpxo.supabase.co/functions/v1/korax-api
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ready=true
          if [ -z "$KOORA_API_BASE_URL" ] || [[ "$KOORA_API_BASE_URL" != https://* ]]; then
            echo "Release APK blocked: configure KOORA_API_BASE_URL with the deployed Supabase Edge Function HTTPS URL."
            ready=false
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release APK blocked: configure all Android release signing secrets."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build optimized release APK
        run: gradle :app:assembleRelease --stacktrace -PKOORA_API_BASE_URL="https://hwrsjmdcivdluztnhpxo.supabase.co/functions/v1/korax-api"
      - name: Prepare test APK asset
        run: |
          cp app/build/outputs/apk/release/app-release.apk KORAX-Android.apk
          file KORAX-Android.apk
      - name: Verify signed APK with apksigner
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs KORAX-Android.apk

      - name: Publish optimized APK as a GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_config.outputs.ready == 'true' && vars.KORAX_RELEASE_ENABLED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release-${{ github.run_number }}
          name: KORAX Android optimized build ${{ github.run_number }}
          body: |
            Optimized KORAX Android APK.
            R8 code shrinking and Android resource shrinking are enabled.
            App features and dependencies are retained; only unused code/resources are removed.
            Installable integration build. Production release requires a stable upload key and Play App Signing.
          prerelease: true
          draft: false
          make_latest: false
          files: KORAX-Android.apk
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KORAX-optimized-apk
          path: KORAX-Android.apk
          if-no-files-found: error
          retention-days: 14
